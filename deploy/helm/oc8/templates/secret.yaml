{{- if not .Values.secrets.jwtSecret }}
{{- fail "secrets.jwtSecret is required — generate with: openssl rand -hex 32" }}
{{- end }}
{{- if not .Values.secrets.secretKek }}
{{- fail "secrets.secretKek is required — generate with: openssl rand -base64 32" }}
{{- end }}
{{- if not .Values.secrets.postgresPassword }}
{{- fail "secrets.postgresPassword is required — generate with: openssl rand -hex 16" }}
{{- end }}
{{- if not .Values.secrets.redisPassword }}
{{- fail "secrets.redisPassword is required — generate with: openssl rand -hex 32" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oc8.fullname" . }}-secrets
  labels:
    {{- include "oc8.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
  secret-kek: {{ .Values.secrets.secretKek | quote }}
  postgres-password: {{ .Values.secrets.postgresPassword | quote }}
  redis-password: {{ .Values.secrets.redisPassword | quote }}
  {{- if .Values.oc8.anthropicApiKey }}
  anthropic-api-key: {{ .Values.oc8.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.oc8.openaiApiKey }}
  openai-api-key: {{ .Values.oc8.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.oc8.mistralApiKey }}
  mistral-api-key: {{ .Values.oc8.mistralApiKey | quote }}
  {{- end }}
